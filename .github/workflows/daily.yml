name: daily

on:
  schedule:
    - cron: '17 3 * * *'   # main run
    - cron: '17 15 * * *'  # backup: fetch only retries failed or missing charts
  workflow_dispatch:
    inputs:
      force:
        description: Re-fetch every chart for today
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Collects today's charts and commits them. Skipped on push (code changes only redeploy).
  fetch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Two degraded passes (~11 min each when the feed hangs most requests) plus the last pass fit.
    timeout-minutes: 45
    concurrency:
      group: fetch
      cancel-in-progress: false
    outputs:
      partial: ${{ steps.fetch.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      # The apps feed hangs ~35-40% of requests at random. fetch.mjs judges each feed (apps, games)
      # on its own: a feed with >= 90% of its charts (after merging with what is saved; a --force run
      # must also get 90% fresh) is saved, the rest is listed as failed, and it exits 1 if any feed was
      # below 90%. A failing first pass is retried once; the last pass, a minute later, only retries
      # charts still missing. continue-on-error: whatever was saved is still committed and deployed;
      # the deploy job then fails the run so GitHub emails the owner.
      - name: Fetch charts
        id: fetch
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          # || true: the last pass must run even if both earlier passes exit 1; its exit code decides.
          npm run fetch -- $FORCE || (sleep 60 && npm run fetch -- $FORCE) || true
          sleep 60
          npm run fetch

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: $(date -u +%F)"
          # main may have moved since checkout (a code push); data/ is only written here, so the rebase is clean.
          git pull --rebase
          git push

  # Builds and deploys from the current main. All deploys share one queue, and each checks out
  # main when it starts, so a push deploy can never overwrite a newer data deploy with old data.
  deploy:
    needs: fetch
    if: ${{ !failure() && !cancelled() }}   # runs after a successful or skipped (push) fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages sometimes finds "0 artifacts" right after the upload (seen twice). The upload is
      # still there, so one retry in the same job after a short wait is enough; re-running the job
      # instead would fail on a duplicate artifact.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail if a feed was below 90%
        if: needs.fetch.outputs.partial == 'true'
        run: |
          echo "::error::A feed was below 90% today (see the fetch job log). Saved data was committed and deployed."
          exit 1
